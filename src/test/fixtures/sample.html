<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Sample HTML Fixture</title>
  </head>
  <body>
    <h1>Hamster Note Document</h1>
    <p>
      This is a <strong>nested strong text</strong> and <em>emphasized content</em> within a
      paragraph.
    </p>
    <p>Escaped script tag: &lt;script&gt;alert('xss')&lt;/script&gt;</p>
    <p>HTML entities: &amp; &lt; &gt; &quot; &#39;</p>
    <div>
      <span>Nested <em>emphasis</em> inside <strong>strong</strong> tag</span>
    </div>
  </body>
</html>
