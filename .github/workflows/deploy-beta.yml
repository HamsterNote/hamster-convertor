# Beta 版本部署到 GitHub Pages
# 触发条件：推送形如 v1.0.0-beta、v2.3.4-beta 的 tag
# 行为：以 BASE_PATH=/beta/ 构建并发布到 gh-pages 分支的 beta/ 子目录
# 设计要点：
# - keep_files: true 让 gh-pages 上其他目录（例如未来的根版本）保持不变
# - 不使用 actions/deploy-pages（它做整站替换，无法子目录共存）
# - 仅 v*-beta 触发；纯 v*（如 v1.0.0）暂不处理
name: Deploy Beta to GitHub Pages

on:
  push:
    tags:
      - 'v*-beta'

# peaceiris/actions-gh-pages 通过 GITHUB_TOKEN 推送 gh-pages 分支，需要 contents:write
permissions:
  contents: write

# 与主验证工作流隔离的并发组，避免互相取消
concurrency:
  group: 'pages-beta'
  cancel-in-progress: false

jobs:
  deploy-beta:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            echo "yarn install attempt ${attempt}/3"

            if yarn install --frozen-lockfile --network-timeout 300000; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi

            sleep 10
          done

      - name: Lint
        run: yarn lint

      - name: Run unit tests
        run: yarn test:run

      # 关键：BASE_PATH=/beta/ 让 vite 构建产物使用 /beta/ 前缀
      # 同时影响 host (vite.config.ts) 与 parser-runtime (packages/parser-runtime/vite.config.ts)
      - name: Build host and parser runtime with /beta/ base
        env:
          BASE_PATH: /beta/
        run: yarn build

      - name: Verify parser runtime artifact
        run: test -f dist/parser-runtime/index.html

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # E2E 在默认 base / 下运行，与构建产物的 /beta/ base 无关
      # （test:e2e 会单独以 vite preview 启动，不读 BASE_PATH）
      - name: Run E2E tests
        run: yarn test:e2e

      # 部署到 gh-pages 分支的 beta/ 子目录
      # destination_dir: beta -> 推送到 gh-pages 分支的 beta/ 路径
      # keep_files: true     -> 保留 gh-pages 分支上其他文件（例如未来根版本）
      # 用户首次使用前需手动设置：Settings -> Pages -> Source -> Deploy from a branch -> gh-pages
      - name: Deploy to gh-pages /beta
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: beta
          keep_files: true
          commit_message: 'chore(beta): deploy ${{ github.ref_name }}'
